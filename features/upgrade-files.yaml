# 文件级升级：Setup/*.xml、SysLog_config.xml、Control_config.xml
# 这些文件不属于 Control/IO 片段，用 file: 直接定位；见 doc/config-upgrade-design.md §3.8。
# 由 hack/gen_upgrade_files.py 生成。
id: upgrade-files
description: 文件级配置升级（Setup 参数、SysLog FileSize、TimeSynchronizer 方法）
version: 1

steps:
  # ── SysLog：新增 FileSize ──
  - name: SysLog 新增 FileSize
    file: SysLog_config.xml
    anchor: SysLog
    add-element:
      - { tag: FileSize, text: "10", after: { tag: Threshold } }

  # ── Control 主文件：TimeSynchronizer 增加一秒定时更新 ──
  - name: TimeSynchronizer 增加 enableOneSecTimerUpdate
    file: Control/Control_config.xml
    anchor: /Control/TimeSynchronizer
    add-method:
      - { name: enableOneSecTimerUpdate }

  # ── CleanRuleRtInfo：延迟时间串改为新腔室布局 ──
  - name: CleanRuleRtInfo 更新 CleanRuleDelayTimeInfo
    file: Setup/CleanRuleRtInfo.xml
    anchor: CleanRuleRtInfo/Option
    set-text:
      - { tag: Value, attr: { paramName: CleanRuleDelayTimeInfo }, value: "Ch1:5000!Ch2:5000!Ch3:5000!Ch4:5000!Ch5:5000!Ch6:5000!ChE:5000!ChF:5000!" }

  # ── Ch1Setup：新增 2 个 Param 与一一对应的 2 个 Value ──
  - name: Ch1Setup 增补参数声明
    file: Setup/Ch1Setup.xml
    anchor: Ch1Setup
    add-element:
      - tag: Param
        attrs: { name: Heater1TcTempDiffMax, dataObject: "/SETUP/Control/Ch1/Heater/PhyHeater/TcTempDiffMax", type: D, min: 0, max: 300, units: K, accuracy: 0.0000001, default: 0 }
        self-close: true
        after: { tag: Param, attr: { name: HeaterWaterVlvOpenTemp } }
      - tag: Param
        attrs: { name: Heater2TcTempDiffMax, dataObject: "/SETUP/Control/Ch1/Heater/PhyHeater2/TcTempDiffMax", type: D, min: 0, max: 300, units: K, accuracy: 0.0000001, default: 0 }
        self-close: true
        after: { tag: Param, attr: { name: HeaterWaterVlvOpenTemp } }
  - name: Ch1Setup 增补取值
    file: Setup/Ch1Setup.xml
    anchor: Ch1Setup/Option
    add-element:
      - tag: Value
        attrs: { paramName: Heater1TcTempDiffMax }
        text: "10"
        after: { tag: Value, attr: { paramName: HeaterWaterVlvOpenTemp } }
      - tag: Value
        attrs: { paramName: Heater2TcTempDiffMax }
        text: "10"
        after: { tag: Value, attr: { paramName: HeaterWaterVlvOpenTemp } }

