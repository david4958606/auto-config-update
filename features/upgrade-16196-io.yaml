      - {"tag": "ConnectDO", "old": "/IO/Ch1Exports/ConstRotation_ConnectDO", "name": "alias", "value": "/IO/Ch1Exports/Rotation_ConnectDO", "attr": {"dataType": "I", "accessMode": "RW"}}

