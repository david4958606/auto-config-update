# 由 hack/gen_upgrade_16196.py 依据 example-16196 config_old → config 差异生成。
# 静态 feature：运行时只依赖 primitives，不读取目标 config/。
id: upgrade-16196-io
description: IOBridge 升级（量程/别名/描述子改写、停用节点删除；逐腔室参数化）
version: 1

steps:
  - name: IOBridge 腔室升级：IO/${Chamber}/PendulumValve
    anchor: IO/${Chamber}/PendulumValve
    set-attr:
      - {"attr": {"accessMode": "R", "dataType": "I"}, "name": "alias", "old": "/IO/${Chamber}Exports/PendulumValve_PositionDI", "tag": "PositionDI", "value": "/IO/${Chamber}Exports/PendulumValve_ActPositionDI"}
      - {"attr": {"accessMode": "RW", "dataType": "I"}, "name": "alias", "old": "/IO/${Chamber}Exports/PendulumValve_PositionDO", "tag": "PositionDO", "value": "/IO/${Chamber}Exports/PendulumValve_ActPositionDO"}

  - name: IOBridge 腔室升级：IOBridge/${Chamber}/SourceDC
    anchor: IOBridge/${Chamber}/SourceDC
    remove-node:
      - {"attr": {"type": "method"}, "tag": "setTimeBtwSendRead", "value": "25000"}
    set-text:
      - {"attr": {"type": "method"}, "old": "1000", "tag": "setTimeout", "value": "300"}
      - {"attr": {"type": "method"}, "old": "1", "tag": "setCmdRetryTimes", "value": "3"}

  - name: IOBridge/Driver_Platform 升级
    file: IOBridge/Driver_Platform
    anchor: EFEM/AfeRobotDriver
    remove-node:
      - {"tag": "printVerboseLog", "attr": {"type": "method"}}

  - name: IOBridge/Driver_Platform 升级
