  - name: Control/Interlock_Ch5 新增节点
    file: Control/Interlock_Ch5
    anchor: Ch5/SInterlocks
    where: { tag-glob: "SInterlocks" }
    add-xml:
      - xml: "<OpenV1 class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/Ch5/Plc/Solenoid/V1DO == Open)</setTrigger>\n\n            <!-- defined in EE-Hard-Interlock -->\n            <createCheckerAlarm type=\"method\">SrcCoverNotClosed,ERROR,Ch5 chamber SourceCover is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/SourceCoverClosedDI == Closed),SrcCoverNotClosed</addChecker>\n            \n            <createCheckerAlarm type=\"method\">LidNotClosed,ERROR,Ch5 chamber Lid is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/LidClosedDI == Closed),LidNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">SlotVlvNotClosed,ERROR,Ch5 chamber slot valve is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/Ch5/SvClosedDI == Closed),SlotVlvNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberNotVac,ERROR,Ch5 chamber is NOT at vacuum.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/VacIgDI == Vac),ChamberNotVac</addChecker>\n\n            <createCheckerAlarm type=\"method\">V41NotClosed,ERROR,Ch5 chamber fast pump valve 'V41' is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/Solenoid/V41DI == Closed),V41NotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">V42NotClosed,ERROR,Ch5 chamber slow pump valve 'V42' is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/Solenoid/V42DI == Closed),V42NotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">V51NotClosed,ERROR,Ch5 chamber pump valve 'V51' is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/Solenoid/V51DI == Closed),V51NotClosed</addChecker>\n\n\n            <createCheckerAlarm type=\"method\">V1Disabled,ERROR,Ch5 chamber 'V1' is disabled.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/V1EnDI == Enabled),V1Disabled</addChecker>\n\n\n            <createCheckerAlarm type=\"method\">BakeoutNotOff,ERROR,Ch5 chamber Bakeout not turn off.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/BakeoutOnoffDO == Off),BakeoutNotOff</addChecker>\n\n        </OpenV1>"
      - xml: "<OpenV33 class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/Ch5/Plc/Solenoid/V33DO == Open)</setTrigger>\n\n            <!--createCheckerAlarm type=\"method\">CDATooHigh,ERROR,Ch5 chamber CDA Pressure is Too High.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/PMCDAHighDI == Normal),CDATooHigh</addChecker>\n            <createCheckerAlarm type=\"method\">CDATooLow,ERROR,Ch5 chamber CDA Pressure is Too Low.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/PMCDALowDI == Normal),CDATooLow</addChecker-->\n            \n            <createCheckerAlarm type=\"method\">V33Disabled,ERROR,Ch5 chamber 'V33' is disabled.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/V33EnDI == Enabled),V33Disabled</addChecker>\n        </OpenV33>"
      - xml: "<OpenV32 class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/Ch5/Plc/Solenoid/V32DO == Open)</setTrigger>\n          \n            <createCheckerAlarm type=\"method\">LidNotClosed,ERROR,Ch5 chamber Lid is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/LidClosedDI == Closed),LidNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberNotVac,ERROR,Ch5 chamber is NOT at vacuum.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/VacIgDI == Vac),ChamberNotVac</addChecker>\n            \n            <createCheckerAlarm type=\"method\">V41NotClosed,ERROR,Ch5 chamber fast pump valve 'V41' is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/Solenoid/V41DI == Closed),V41NotClosed</addChecker>\n            \n            <createCheckerAlarm type=\"method\">V42NotClosed,ERROR,Ch5 chamber slow pump valve 'V42' is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/Solenoid/V42DI == Closed),V42NotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">V51NotClosed,ERROR,Ch5 chamber slow pump valve 'V51' is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/Solenoid/V51DI == Closed),V51NotClosed</addChecker>\n\n            <!--createCheckerAlarm type=\"method\">CDATooHigh,ERROR,Ch5 chamber CDA Pressure is Too High.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/PMCDAHighDI == Normal),CDATooHigh</addChecker>\n            <createCheckerAlarm type=\"method\">CDATooLow,ERROR,Ch5 chamber CDA Pressure is Too Low.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/PMCDALowDI == Normal),CDATooLow</addChecker-->\n            \n            <createCheckerAlarm type=\"method\">V32Disabled,ERROR,Ch5 chamber 'V32' is disabled.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/V32EnDI == Enabled),V32Disabled</addChecker>\n\n        </OpenV32>"
      - xml: "<OpenV31 class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/Ch5/Plc/Solenoid/V31DO == Open)</setTrigger>\n            \n            <!-- defined in EE-Hard-Interlock -->\n            <createCheckerAlarm type=\"method\">SrcCoverNotClosed,ERROR,Ch5 chamber SourceCover is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/SourceCoverClosedDI == Closed),SrcCoverNotClosed</addChecker>\n            \n\n            <createCheckerAlarm type=\"method\">LidNotClosed,ERROR,Ch5 chamber Lid is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/LidClosedDI == Closed),LidNotClosed</addChecker>\n            \n            <createCheckerAlarm type=\"method\">SlotVlvNotClosed,ERROR,Ch5 chamber slot valve is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/Ch5/SvClosedDI == Closed),SlotVlvNotClosed</addChecker>\n            \n            <!--createCheckerAlarm type=\"method\">CDATooHigh,ERROR,Ch5 chamber CDA Pressure is Too High.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/PMCDAHighDI == Normal),CDATooHigh</addChecker>           \n            <createCheckerAlarm type=\"method\">CDATooLow,ERROR,Ch5 chamber CDA Pressure is Too Low.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/PMCDALowDI == Normal),CDATooLow</addChecker-->\n            \n            <createCheckerAlarm type=\"method\">V31Disabled,ERROR,Ch5 chamber 'V31' is disabled.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/V31EnDI == Enabled),V31Disabled</addChecker>\n            <createCheckerAlarm type=\"method\">BakeoutNotOff,ERROR,Ch5 chamber Bakeout not turn off.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/BakeoutOnoffDO == Off),BakeoutNotOff</addChecker>\n        </OpenV31>"
      - xml: "<EMag1DcOn class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/LoadRack/Plc/Ch5/EMag1/PowerOnoffDO == On)</setTrigger>\n\n            <createCheckerAlarm type=\"method\">LidNotClosed,ERROR,Ch5 chamber lid is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/LidClosedDI == Closed),LidNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">SvNotClosed,ERROR,Ch5 chamber slot valve is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/Ch5/SvClosedDI == Closed),SvNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">SrcCoverNotClosed,ERROR,Ch5 chamber Source Cover is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/SourceCoverClosedDI == Closed),SrcCoverNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">EMagBoxNotClosed,ERROR,Ch5 chamber EMag Box is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/EMagCoverClosedDI == Closed),EMagBoxNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">TargetWaterAbnormal,ERROR,Ch5 chamber target water is abnormal.(Hard Interlock)</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/TargetWaterFlowDI == Normal),TargetWaterAbnormal</addChecker>\n\n            <createCheckerAlarm type=\"method\">PedWaterAbnormal,ERROR,Ch5 chamber chuck water is abnormal.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/HeaterWaterFlowDI == Normal),PedWaterAbnormal</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberOver149,ERROR,Ch5 chamber is NOT less than 149 centigrade.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/ChamberOverTempDI == Normal),ChamberOver149</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberNotVac,ERROR,Ch5 chamber is NOT in vacuum.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/VacIgDI == Vac),ChamberNotVac</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberOverPressure,ERROR,Ch5 chamber is over pressure.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/IG/PressureAI &lt; 0.2),ChamberOverPressure</addChecker>\n\n            <createCheckerAlarm type=\"method\">NoWfrOrDisk,ERROR,No wafer or shutter disk on the pedestal in Ch5 chamber.</createCheckerAlarm>\n            <addChecker type=\"method\">((/IO/Ch5Exports/Slot1 == Present) || (/IO/Ch5Exports/Slot1 == Shuttered)),NoWfrOrDisk</addChecker>\n\n        </EMag1DcOn>"
      - xml: "<EMag2DcOn class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/LoadRack/Plc/Ch5/EMag2/PowerOnoffDO == On)</setTrigger>\n\n            <createCheckerAlarm type=\"method\">LidNotClosed,ERROR,Ch5 chamber lid is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/LidClosedDI == Closed),LidNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">SvNotClosed,ERROR,Ch5 chamber slot valve is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/Ch5/SvClosedDI == Closed),SvNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">SrcCoverNotClosed,ERROR,Ch5 chamber Source Cover is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/SourceCoverClosedDI == Closed),SrcCoverNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">EMagBoxNotClosed,ERROR,Ch5 chamber EMag Box is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/EMagCoverClosedDI == Closed),EMagBoxNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">TargetWaterAbnormal,ERROR,Ch5 chamber target water is abnormal.(Hard Interlock)</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/TargetWaterFlowDI == Normal),TargetWaterAbnormal</addChecker>\n\n            <createCheckerAlarm type=\"method\">PedWaterAbnormal,ERROR,Ch5 chamber chuck water is abnormal.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/HeaterWaterFlowDI == Normal),PedWaterAbnormal</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberOver149,ERROR,Ch5 chamber is NOT less than 149 centigrade.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/ChamberOverTempDI == Normal),ChamberOver149</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberNotVac,ERROR,Ch5 chamber is NOT in vacuum.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/Plc/VacIgDI == Vac),ChamberNotVac</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberOverPressure,ERROR,Ch5 chamber is over pressure.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch5/IG/PressureAI &lt; 0.2),ChamberOverPressure</addChecker>\n\n            <createCheckerAlarm type=\"method\">NoWfrOrDisk,ERROR,No wafer or shutter disk on the pedestal in Ch5 chamber.</createCheckerAlarm>\n            <addChecker type=\"method\">((/IO/Ch5Exports/Slot1 == Present) || (/IO/Ch5Exports/Slot1 == Shuttered)),NoWfrOrDisk</addChecker>\n\n        </EMag2DcOn>"
      - xml: "<BakeoutPowerOn class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/Ch5/Plc/BakeoutEnDO == Enable)</setTrigger>\n\n            <createCheckerAlarm type=\"method\">SrcDcNotOff,ERROR,Ch5 chamber source DC is not off.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/LoadRack/Ch5/SourceDC/OnoffDI == Off),SrcDcNotOff</addChecker>\n\n            <createCheckerAlarm type=\"method\">RfNotOff,ERROR,Ch5 chamber  Rf is not off.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/LoadRack/Plc/Ch5/BiasRF/OnoffDI == Off),RfNotOff</addChecker>\n\n            <!--createCheckerAlarm type=\"method\">CoilRfNotOff,ERROR,Ch5 chamber Coil Rf is not off.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/LoadRack/Plc/Ch5/CoilRF/OnoffDI == Off),CoilRfNotOff</addChecker-->\n        </BakeoutPowerOn>"
