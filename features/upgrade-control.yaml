ker type=\"method\">(/IO/Ch6/Plc/V32EnDI == Enabled),V32Disabled</addChecker>\n\n        </OpenV32>"
      - xml: "<OpenV31 class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/Ch6/Plc/Solenoid/V31DO == Open)</setTrigger>\n            \n            <!-- defined in EE-Hard-Interlock -->\n            <createCheckerAlarm type=\"method\">SrcCoverNotClosed,ERROR,Ch6 chamber SourceCover is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/SourceCoverClosedDI == Closed),SrcCoverNotClosed</addChecker>\n            \n\n            <createCheckerAlarm type=\"method\">LidNotClosed,ERROR,Ch6 chamber Lid is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/LidClosedDI == Closed),LidNotClosed</addChecker>\n            \n            <createCheckerAlarm type=\"method\">SlotVlvNotClosed,ERROR,Ch6 chamber slot valve is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/Ch6/SvClosedDI == Closed),SlotVlvNotClosed</addChecker>\n            \n            <!--createCheckerAlarm type=\"method\">CDATooHigh,ERROR,Ch6 chamber CDA Pressure is Too High.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/PMCDAHighDI == Normal),CDATooHigh</addChecker>           \n            <createCheckerAlarm type=\"method\">CDATooLow,ERROR,Ch6 chamber CDA Pressure is Too Low.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/PMCDALowDI == Normal),CDATooLow</addChecker-->\n            \n            <createCheckerAlarm type=\"method\">V31Disabled,ERROR,Ch6 chamber 'V31' is disabled.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/V31EnDI == Enabled),V31Disabled</addChecker>\n\n            <createCheckerAlarm type=\"method\">BakeoutNotOff,ERROR,Ch6 chamber Bakeout not turn off.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/BakeoutOnoffDO == Off),BakeoutNotOff</addChecker>\n        </OpenV31>"
      - xml: "<EMag1DcOn class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/LoadRack/Plc/Ch6/EMag1/PowerOnoffDO == On)</setTrigger>\n\n            <createCheckerAlarm type=\"method\">LidNotClosed,ERROR,Ch6 chamber lid is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/LidClosedDI == Closed),LidNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">SvNotClosed,ERROR,Ch6 chamber slot valve is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/Ch6/SvClosedDI == Closed),SvNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">SrcCoverNotClosed,ERROR,Ch6 chamber Source Cover is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/SourceCoverClosedDI == Closed),SrcCoverNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">EMagBoxNotClosed,ERROR,Ch6 chamber EMag Box is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/EMagCoverClosedDI == Closed),EMagBoxNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">TargetWaterAbnormal,ERROR,Ch6 chamber target water is abnormal.(Hard Interlock)</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/TargetWaterFlowDI == Normal),TargetWaterAbnormal</addChecker>\n\n            <createCheckerAlarm type=\"method\">PedWaterAbnormal,ERROR,Ch6 chamber chuck water is abnormal.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/HeaterWaterFlowDI == Normal),PedWaterAbnormal</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberOver149,ERROR,Ch6 chamber is NOT less than 149 centigrade.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/ChamberOverTempDI == Normal),ChamberOver149</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberNotVac,ERROR,Ch6 chamber is NOT in vacuum.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/VacIgDI == Vac),ChamberNotVac</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberOverPressure,ERROR,Ch6 chamber is over pressure.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/IG/PressureAI &lt; 0.2),ChamberOverPressure</addChecker>\n\n            <createCheckerAlarm type=\"method\">NoWfrOrDisk,ERROR,No wafer or shutter disk on the pedestal in Ch6 chamber.</createCheckerAlarm>\n            <addChecker type=\"method\">((/IO/Ch6Exports/Slot1 == Present) || (/IO/Ch6Exports/Slot1 == Shuttered)),NoWfrOrDisk</addChecker>\n\n        </EMag1DcOn>"
      - xml: "<EMag2DcOn class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/LoadRack/Plc/Ch6/EMag2/PowerOnoffDO == On)</setTrigger>\n\n            <createCheckerAlarm type=\"method\">LidNotClosed,ERROR,Ch6 chamber lid is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/LidClosedDI == Closed),LidNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">SvNotClosed,ERROR,Ch6 chamber slot valve is NOT closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Platform/Plc/Ch6/SvClosedDI == Closed),SvNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">SrcCoverNotClosed,ERROR,Ch6 chamber Source Cover is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/SourceCoverClosedDI == Closed),SrcCoverNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">EMagBoxNotClosed,ERROR,Ch6 chamber EMag Box is not closed.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/EMagCoverClosedDI == Closed),EMagBoxNotClosed</addChecker>\n\n            <createCheckerAlarm type=\"method\">TargetWaterAbnormal,ERROR,Ch6 chamber target water is abnormal.(Hard Interlock)</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/TargetWaterFlowDI == Normal),TargetWaterAbnormal</addChecker>\n\n            <createCheckerAlarm type=\"method\">PedWaterAbnormal,ERROR,Ch6 chamber chuck water is abnormal.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/HeaterWaterFlowDI == Normal),PedWaterAbnormal</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberOver149,ERROR,Ch6 chamber is NOT less than 149 centigrade.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/Ch6/Plc/ChamberOverTempDI == Normal),ChamberOver149</addChecker>\n\n            <createCheckerAlarm type=\"method\">ChamberNotVac,ERROR,Ch6 chamber is NOT in vacuum.<