    file: Control/Interlock_Ch6
    anchor: Ch6/VInterlocks
    where: { tag-glob: "VInterlocks" }
    add-xml:
      - xml: "<DevicenetCh6SourceDC class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/LoadRack/DnStatus/Ch6SourceDC != 2)</setTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,ERROR,LoadRack chamber Ch6SourceDC module devicenet is abnormal.</setIntlkAlarm>\n            &SimulatedFlag_Ch6;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n        </DevicenetCh6SourceDC>"
      - xml: "<SourceStatus type=\"data\" dataType=\"I\" accessMode=\"RW\" alias=\"\">\n            <Bd></Bd>\n            <Ch></Ch>\n            <DescriptorList>On:0,OffNormal:1,OffAbnormal:2</DescriptorList>\n            &SimulatedFlag_Ch6;\n        </SourceStatus>"
      - xml: "<SrcDcPower class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setDurationTrigger type=\"method\">(((/IO/LoadRack/Ch6/SourceDC/PowerAO == 0.0)&amp;&amp;(/IO/LoadRack/Ch6/SourceDC/OnoffDO == Off))&amp;&amp;(/Control/Ch6/VInterlocks/SourceStatus == OffAbnormal)),4000</setDurationTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,ERROR,Ch6 chamber turn off SourceDC failed.</setIntlkAlarm>\n            &SimulatedFlag_Ch6;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n        </SrcDcPower>"
      - xml: "<SrcDcStatusOn class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">((/IO/LoadRack/Ch6/SourceDC/PowerAO > 0.0) || (/IO/LoadRack/Ch6/SourceDC/OnoffDO == On))</setTrigger>\n            &SimulatedFlag_Ch6;\n            <addIntDescriptorActionNoAlarm type=\"method\">/Control/Ch6/VInterlocks/SourceStatus,On</addIntDescriptorActionNoAlarm>\n        </SrcDcStatusOn>"
      - xml: "<SrcDcStatusOffAbnormal class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(((/IO/LoadRack/Ch6/SourceDC/PowerAO == 0.0)&amp;&amp;(/IO/LoadRack/Ch6/SourceDC/OnoffDO == Off))&amp;&amp;(/IO/LoadRack/Ch6/SourceDC/PowerAI > 50.0))</setTrigger>\n            &SimulatedFlag_Ch6;\n            <addIntDescriptorActionNoAlarm type=\"method\">/Control/Ch6/VInterlocks/SourceStatus,OffAbnormal</addIntDescriptorActionNoAlarm>\n        </SrcDcStatusOffAbnormal>"
      - xml: "<SrcDcStatusOffNormal class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(((/IO/LoadRack/Ch6/SourceDC/PowerAO == 0.0)&amp;&amp;(/IO/LoadRack/Ch6/SourceDC/OnoffDO == Off))&amp;&amp;(/IO/LoadRack/Ch6/SourceDC/PowerAI &lt; 50.0))</setTrigger>\n            &SimulatedFlag_Ch6;\n            <addIntDescriptorActionNoAlarm type=\"method\">/Control/Ch6/VInterlocks/SourceStatus,OffNormal</addIntDescriptorActionNoAlarm>\n        </SrcDcStatusOffNormal>"
      - xml: "<PIBBoxOpen type=\"instance\" class=\"VInterlock\">\n            <setTrigger type=\"method\">(/IO/Ch6/Plc/PIBCoverClosedDI == NotClosed)</setTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,ERROR,Ch6 chamber PIBBox is not closed.</setIntlkAlarm>\n            &SimulatedFlag_Ch6;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n            \n            <createActionAlarm type=\"method\">RfOff,NOTICE,Rf is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Plc/Ch6/BiasRF/OnoffDO,Off,RfOff</addIntDescriptorAction>\n            \n            <!--createActionAlarm type=\"method\">CoilRfOff,NOTICE,CoilRf is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Plc/Ch6/CoilRF/OnoffDO,Off,CoilRfOff</addIntDescriptorAction-->\n\n            <createActionAlarm type=\"method\">SrcDcOff,NOTICE,Source DC is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Ch6/SourceDC/OnoffDO,Off,SrcDcOff</addIntDescriptorAction>\n        </PIBBoxOpen>"
      - xml: "<BiasMatchSafety type=\"instance\" class=\"VInterlock\">\n            <setTrigger type=\"method\">(/IO/Ch6/Plc/BiasMatchSafetyDI == Abnormal)</setTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,FATAL,Ch6 chamber Bias match is abnormal.</setIntlkAlarm>\n            &SimulatedFlag_Ch6;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n        </BiasMatchSafety>"
      - xml: "<EscWaterFlow class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setDurationTrigger type=\"method\">(/IO/Ch6/Plc/HeaterWaterFlowDI == Abnormal),10000</setDurationTrigger>\n            <setIntlkAlarm type=\"method\">Abnormal,ERROR,Ch6 chamber chuck water is abnormal.</setIntlkAlarm>\n            &SimulatedFlag_Ch6;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n            <createActionAlarm type=\"method\">BakeoutOff,NOTICE,Ch6 chamber Bakeout will turn off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/Ch6/Plc/BakeoutOnoffDO,Off,BakeoutOff</addIntDescriptorAction>\n \n            <createActionAlarm type=\"method\">RfOff,NOTICE,Rf is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Plc/Ch6/BiasRF/OnoffDO,Off,RfOff</addIntDescriptorAction>\n            \n            <!--createActionAlarm type=\"method\">CoilRfOff,NOTICE,CoilRf is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Plc/Ch6/CoilRF/OnoffDO,Off,CoilRfOff</addIntDescriptorAction-->\n\n            <createActionAlarm type=\"method\">SrcDcOff,NOTICE,Source DC is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Ch6/SourceDC/OnoffDO,Off,SrcDcOff</addIntDescriptorAction>\n \n        </EscWaterFlow>"
