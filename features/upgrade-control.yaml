  - name: Control/Interlock_Ch1 新增节点
    file: Control/Interlock_Ch1
    anchor: Ch1/VInterlocks
    where: { tag-glob: "VInterlocks" }
    add-xml:
      - xml: "<DevicenetCh1SourceDC class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/LoadRack/DnStatus/Ch1SourceDC != 2)</setTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,ERROR,LoadRack chamber Ch1SourceDC module devicenet is abnormal.</setIntlkAlarm>\n            &SimulatedFlag_Ch1;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n        </DevicenetCh1SourceDC>"
      - xml: "<SourceStatus type=\"data\" dataType=\"I\" accessMode=\"RW\" alias=\"\">\n            <Bd></Bd>\n            <Ch></Ch>\n            <DescriptorList>On:0,OffNormal:1,OffAbnormal:2</DescriptorList>\n            &SimulatedFlag_Ch1;\n        </SourceStatus>"
      - xml: "<SrcDcPower class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setDurationTrigger type=\"method\">(((/IO/LoadRack/Ch1/SourceDC/PowerAO == 0.0)&amp;&amp;(/IO/LoadRack/Ch1/SourceDC/OnoffDO == Off))&amp;&amp;(/Control/Ch1/VInterlocks/SourceStatus == OffAbnormal)),4000</setDurationTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,ERROR,Ch1 chamber turn off SourceDC failed.</setIntlkAlarm>\n            &SimulatedFlag_Ch1;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n        </SrcDcPower>"
      - xml: "<SrcDcStatusOn class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">((/IO/LoadRack/Ch1/SourceDC/PowerAO > 0.0) || (/IO/LoadRack/Ch1/SourceDC/OnoffDO == On))</setTrigger>\n            &SimulatedFlag_Ch1;\n            <addIntDescriptorActionNoAlarm type=\"method\">/Control/Ch1/VInterlocks/SourceStatus,On</addIntDescriptorActionNoAlarm>\n        </SrcDcStatusOn>"
      - xml: "<SrcDcStatusOffAbnormal class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(((/IO/LoadRack/Ch1/SourceDC/PowerAO == 0.0)&amp;&amp;(/IO/LoadRack/Ch1/SourceDC/OnoffDO == Off))&amp;&amp;(/IO/LoadRack/Ch1/SourceDC/PowerAI > 50.0))</setTrigger>\n            &SimulatedFlag_Ch1;\n            <addIntDescriptorActionNoAlarm type=\"method\">/Control/Ch1/VInterlocks/SourceStatus,OffAbnormal</addIntDescriptorActionNoAlarm>\n        </SrcDcStatusOffAbnormal>"
      - xml: "<SrcDcStatusOffNormal class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(((/IO/LoadRack/Ch1/SourceDC/PowerAO == 0.0)&amp;&amp;(/IO/LoadRack/Ch1/SourceDC/OnoffDO == Off))&amp;&amp;(/IO/LoadRack/Ch1/SourceDC/PowerAI &lt; 50.0))</setTrigger>\n            &SimulatedFlag_Ch1;\n            <addIntDescriptorActionNoAlarm type=\"method\">/Control/Ch1/VInterlocks/SourceStatus,OffNormal</addIntDescriptorActionNoAlarm>\n        </SrcDcStatusOffNormal>"
