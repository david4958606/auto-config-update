      - xml: "<BakeoutPowerOn class=\"SInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/Ch6/Plc/BakeoutEnDO == Enable)</setTrigger>\n\n            <createCheckerAlarm type=\"method\">SrcDcNotOff,ERROR,Ch6 chamber source DC is not off.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/LoadRack/Ch6/SourceDC/OnoffDI == Off),SrcDcNotOff</addChecker>\n\n            <createCheckerAlarm type=\"method\">RfNotOff,ERROR,Ch6 chamber  Rf is not off.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/LoadRack/Plc/Ch6/BiasRF/OnoffDI == Off),RfNotOff</addChecker>\n\n            <!--createCheckerAlarm type=\"method\">CoilRfNotOff,ERROR,Ch6 chamber Coil Rf is not off.</createCheckerAlarm>\n            <addChecker type=\"method\">(/IO/LoadRack/Plc/Ch6/CoilRF/OnoffDI == Off),CoilRfNotOff</addChecker-->\n        </BakeoutPowerOn>"
