  - name: Control/Interlock_Ch4 新增节点
    file: Control/Interlock_Ch4
    anchor: Ch4/VInterlocks
    where: { tag-glob: "VInterlocks" }
    add-xml:
      - xml: "<DevicenetCh4SourceDC class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(/IO/LoadRack/DnStatus/Ch4SourceDC != 2)</setTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,ERROR,LoadRack chamber Ch4SourceDC module devicenet is abnormal.</setIntlkAlarm>\n            &SimulatedFlag_Ch4;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n        </DevicenetCh4SourceDC>"
      - xml: "<SourceStatus type=\"data\" dataType=\"I\" accessMode=\"RW\" alias=\"\">\n            <Bd></Bd>\n            <Ch></Ch>\n            <DescriptorList>On:0,OffNormal:1,OffAbnormal:2</DescriptorList>\n            &SimulatedFlag_Ch4;\n        </SourceStatus>"
      - xml: "<SrcDcPower class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setDurationTrigger type=\"method\">(((/IO/LoadRack/Ch4/SourceDC/PowerAO == 0.0)&amp;&amp;(/IO/LoadRack/Ch4/SourceDC/OnoffDO == Off))&amp;&amp;(/Control/Ch4/VInterlocks/SourceStatus == OffAbnormal)),4000</setDurationTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,ERROR,Ch4 chamber turn off SourceDC failed.</setIntlkAlarm>\n            &SimulatedFlag_Ch4;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n        </SrcDcPower>"
      - xml: "<SrcDcStatusOn class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">((/IO/LoadRack/Ch4/SourceDC/PowerAO > 0.0) || (/IO/LoadRack/Ch4/SourceDC/OnoffDO == On))</setTrigger>\n            &SimulatedFlag_Ch4;\n            <addIntDescriptorActionNoAlarm type=\"method\">/Control/Ch4/VInterlocks/SourceStatus,On</addIntDescriptorActionNoAlarm>\n        </SrcDcStatusOn>"
      - xml: "<SrcDcStatusOffAbnormal class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(((/IO/LoadRack/Ch4/SourceDC/PowerAO == 0.0)&amp;&amp;(/IO/LoadRack/Ch4/SourceDC/OnoffDO == Off))&amp;&amp;(/IO/LoadRack/Ch4/SourceDC/PowerAI > 50.0))</setTrigger>\n            &SimulatedFlag_Ch4;\n            <addIntDescriptorActionNoAlarm type=\"method\">/Control/Ch4/VInterlocks/SourceStatus,OffAbnormal</addIntDescriptorActionNoAlarm>\n        </SrcDcStatusOffAbnormal>"
      - xml: "<SrcDcStatusOffNormal class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setTrigger type=\"method\">(((/IO/LoadRack/Ch4/SourceDC/PowerAO == 0.0)&amp;&amp;(/IO/LoadRack/Ch4/SourceDC/OnoffDO == Off))&amp;&amp;(/IO/LoadRack/Ch4/SourceDC/PowerAI &lt; 50.0))</setTrigger>\n            &SimulatedFlag_Ch4;\n            <addIntDescriptorActionNoAlarm type=\"method\">/Control/Ch4/VInterlocks/SourceStatus,OffNormal</addIntDescriptorActionNoAlarm>\n        </SrcDcStatusOffNormal>"
      - xml: "<PIBBoxOpen type=\"instance\" class=\"VInterlock\">\n            <setTrigger type=\"method\">(/IO/Ch4/Plc/PIBCoverClosedDI == NotClosed)</setTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,ERROR,Ch4 chamber PIBBox is not closed.</setIntlkAlarm>\n            &SimulatedFlag_Ch4;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n            \n            <createActionAlarm type=\"method\">RfOff,NOTICE,Rf is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Plc/Ch4/BiasRF/OnoffDO,Off,RfOff</addIntDescriptorAction>\n            \n            <!--createActionAlarm type=\"method\">CoilRfOff,NOTICE,CoilRf is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Plc/Ch4/CoilRF/OnoffDO,Off,CoilRfOff</addIntDescriptorAction-->\n\n            <createActionAlarm type=\"method\">SrcDcOff,NOTICE,Source DC is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Ch4/SourceDC/OnoffDO,Off,SrcDcOff</addIntDescriptorAction>\n        </PIBBoxOpen>"
      - xml: "<BiasMatchSafety type=\"instance\" class=\"VInterlock\">\n            <setTrigger type=\"method\">(/IO/Ch4/Plc/BiasMatchSafetyDI == Abnormal)</setTrigger>\n            <setIntlkAlarm type=\"method\">Alarm,FATAL,Ch4 chamber Bias match is abnormal.</setIntlkAlarm>\n            &SimulatedFlag_Ch4;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n        </BiasMatchSafety>"
      - xml: "<EscWaterFlow class=\"VInterlock\" type=\"instance\" alias=\"\">\n            <setDurationTrigger type=\"method\">(/IO/Ch4/Plc/HeaterWaterFlowDI == Abnormal),10000</setDurationTrigger>\n            <setIntlkAlarm type=\"method\">Abnormal,ERROR,Ch4 chamber chuck water is abnormal.</setIntlkAlarm>\n            &SimulatedFlag_Ch4;\n            <acceptUnknown type=\"method\">TriggerUnknown,FATAL,Interlock trigger state is unknown. (Hardware IO may be unavailable)</acceptUnknown>\n            <createActionAlarm type=\"method\">BakeoutOff,NOTICE,Ch4 chamber Bakeout will turn off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/Ch4/Plc/BakeoutOnoffDO,Off,BakeoutOff</addIntDescriptorAction>\n \n            <createActionAlarm type=\"method\">RfOff,NOTICE,Rf is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Plc/Ch4/BiasRF/OnoffDO,Off,RfOff</addIntDescriptorAction>\n            \n            <!--createActionAlarm type=\"method\">CoilRfOff,NOTICE,CoilRf is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Plc/Ch4/CoilRF/OnoffDO,Off,CoilRfOff</addIntDescriptorAction-->\n\n            <createActionAlarm type=\"method\">SrcDcOff,NOTICE,Source DC is turned off.</createActionAlarm>\n            <addIntDescriptorAction type=\"method\">/IO/LoadRack/Ch4/SourceDC/OnoffDO,Off,SrcDcOff</addIntDescriptorAction>\n \n        </EscWaterFlow>"
